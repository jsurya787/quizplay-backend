name: Keep Render App Alive

on:
  schedule:
    # Runs every 10 minutes - uses curl (no Node setup needed, faster & more reliable)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Quiz API health endpoint
        run: |
          echo "Pinging at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            -H "User-Agent: GitHub-Actions-KeepAlive/1.0" \
            "https://api.quizplay.co.in/health")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Server is alive (HTTP $STATUS)"
          else
            echo "⚠️ Unexpected status: $STATUS"
            exit 1
          fi

      - name: Log result
        if: always()
        run: echo "Keep-alive job completed at $(date -u)"
