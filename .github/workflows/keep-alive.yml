name: Keep Render App Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend and frontend to keep both alive
        run: |
          for URL in \
            https://quizplay-backend.onrender.com/health \
            https://www.quizplay.co.in/; do
            echo "Pinging $URL"
            curl -fsSL --retry 3 --retry-delay 5 "$URL"
          done
        timeout-minutes: 1
